[[IgnoredVulns]]
id = "RUSTSEC-2026-0403"
ignoreUntil = 2026-11-26
reason = """zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. \
Uninitialized memory when streaming decompression of a legacy frame fails: the advisory affects the write-side Decoder; xezim-core decodes through the read-side stream Decoder, which the advisory lists as unaffected. \
Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26."""


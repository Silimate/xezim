# cargo-deny's gates for a release build (docs/release.md): what the shipped
# binary links must carry an allowed license, come from crates.io or the
# pinned xezim-core repository, and have no open RustSec advisory.
# release/build.sh runs `cargo deny --config release/deny.toml check` on
# release/Cargo.lock.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
# Test-only crates don't ship.
exclude-dev = true

[advisories]
# Every advisory fails the gate: a vulnerability, an unsound or unmaintained
# crate, a yanked version. An exception goes in `ignore`, with the reason and
# what would let it be dropped, and the same id in release/osv-scanner.toml.
unmaintained = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained, not vulnerable: its authors consider it complete. xezim and xezim-core use it for the design cache and compiled artifacts they write themselves. Drop this when xezim-core moves off it." },
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. Data from an abandoned stream leaking into the next stream on a reused context: only through raw Encoder/Decoder::with_context, which is not used; every stream has its own context. Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26." },
    { id = "RUSTSEC-2026-0395", reason = "zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. Use-after-free with CParameter::StableInBuffer: the parameter is never set (the stream encoder sets only the compression level). Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26." },
    { id = "RUSTSEC-2026-0396", reason = "zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. Seekable reads a NULL or out-of-bounds seek table: the seekable API is not built or used. Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26." },
    { id = "RUSTSEC-2026-0397", reason = "zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. OutBuffer::around_pos exposes uninitialized memory: neither xezim-core nor zstd 0.13.3 calls it. Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26." },
    { id = "RUSTSEC-2026-0398", reason = "zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. Seekable::decompress sets a Vec length past its capacity: the seekable API is not built or used. Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26." },
    { id = "RUSTSEC-2026-0399", reason = "zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. Use-after-free through init_using_cdict/init_using_ddict: not called; no dictionary is used. Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26." },
    { id = "RUSTSEC-2026-0400", reason = "zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. Use-after-free of a dictionary after a one-shot DCtx::decompress on a context with an open stream: the one-shot (bulk) API and dictionaries are not used. Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26." },
    { id = "RUSTSEC-2026-0401", reason = "zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. Out-of-bounds read in train_from_buffer: dictionaries are never trained. Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26." },
    { id = "RUSTSEC-2026-0402", reason = "zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. Heap overflow in CCtx::try_clone on a multithreaded context: contexts are never cloned, and zstd is built without multithreading. Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26." },
    { id = "RUSTSEC-2026-0403", reason = "zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. Uninitialized memory when streaming decompression of a legacy frame fails: the advisory affects the write-side Decoder; xezim-core decodes through the read-side stream Decoder, which the advisory lists as unaffected. Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26." },
    { id = "RUSTSEC-2026-0404", reason = "zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. Double free in DCtx::try_clone: contexts are never cloned. Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26." },
    { id = "RUSTSEC-2026-0405", reason = "zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. Out-of-bounds read with an out-of-range InBuffer::pos in SeekableCStream: the seekable API is not built or used. Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26." },
    { id = "RUSTSEC-2026-0406", reason = "zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. Use-after-free when changing a multithreaded context with an unfinished frame: zstd is built without multithreading, and the encoder's empty dictionary is loaded when it is created, before any frame. Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26." },
]

[licenses]
# Permissive licenses only: no GPL, LGPL, AGPL or other copyleft. A crate
# offered under alternatives (`MIT OR Apache-2.0`) passes when one of them is
# here; licenses that apply together (`AND`) must all be.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The list is the policy, so a license no crate uses yet stays on it.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/aionhw/xezim-core.git"]

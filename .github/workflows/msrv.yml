name: MSRV

# Fork-only CI policy, kept at upstream syncs: main, and pull requests that
# change the manifests, the toolchain or this workflow.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "rust-toolchain*", ".github/workflows/msrv.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 1

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # xezim-core is a git dependency in Cargo.toml (cargo clones it), but
      # Cargo.lock is gitignored so it tracks a moving main — the build cache
      # key still needs the core commit to avoid reusing a tree built against
      # a different core.
      - name: Resolve xezim-core HEAD
        run: |
          echo "CORE_SHA=$(git ls-remote https://github.com/aionhw/xezim-core.git refs/heads/main | cut -f1)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-msrv-cargoreg-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-msrv-cargoreg-

      # See the note in test.yml: Cargo.lock is gitignored, so the old key
      # hashed to nothing and one shared `target/` was reused across every
      # commit and every ../xezim-core revision.
      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-msrv-target-${{ hashFiles('**/Cargo.toml') }}-${{ env.CORE_SHA }}

      - name: Install cargo-msrv
        run: cargo install cargo-msrv --locked

      - name: cargo msrv verify
        run: cargo msrv verify

      - name: Check optional features at MSRV
        run: |
          TASK_MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$TASK_MSRV"
          rustup toolchain install "$TASK_MSRV" --profile minimal
          cargo +"$TASK_MSRV" check --all-targets --features jit

name: Release

# A vVERSION tag releases xezim (docs/release.md): VERSION is Cargo.toml's
# version, or it and a -label. A manual run, or a pull request that changes the
# release files, is a dry run: it builds, gates and packs, and uploads the files
# as a workflow artifact, but signs, archives and publishes nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["release/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history: gitleaks scans it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build, gate and pack
        run: release/run.sh build
      - name: Smoke test on EL8
        run: release/run.sh smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist
          retention-days: 7

  # Only this job can sign: the key's workload identity provider accepts only
  # this workflow on a v* tag of this repository.
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      # SLSA build provenance for the tarballs, signed through Sigstore
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/xezim-*.tar.gz
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - name: Sign
        env:
          GCP_TOKEN: ${{ steps.auth.outputs.access_token }}
          RELEASE_SIGNING_KEY: ${{ vars.RELEASE_SIGNING_KEY }}
        run: release/sign.sh dist/SHA256SUMS dist/provenance.json
      # Publishing locks an immutable release, so its assets go to a draft,
      # published once archived. The debug info goes to GCS only.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "xezim ${TAG#v}" \
            --generate-notes --prerelease=${{ contains(github.ref_name, '-rc') }} \
            "xezim-${TAG#v}-linux-x86_64.tar.gz" SHA256SUMS SHA256SUMS.sig sbom.cdx.json \
            THIRD_PARTY_NOTICES provenance.json provenance.json.sig
      - name: Archive to GCS
        env:
          GCP_TOKEN: ${{ steps.auth.outputs.access_token }}
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
        run: release/archive.sh "${TAG#v}" dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

# Exceptions to the OSV-Scanner gate of a release build (docs/release.md): one
# [[IgnoredVulns]] per finding, with its id, the reason, and an ignoreUntil
# when it must be looked at again. Keep it in step with release/deny.toml.

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
ignoreUntil = 2027-04-22
reason = """bincode 1.3.3 is unmaintained, not vulnerable: its authors consider it complete. \
xezim and xezim-core use it for the design cache and compiled artifacts they write themselves. \
Drop this when xezim-core moves off it."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0391"
ignoreUntil = 2026-11-26
reason = """zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. \
Data from an abandoned stream leaking into the next stream on a reused context: only through raw Encoder/Decoder::with_context, which is not used; every stream has its own context. \
Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0395"
ignoreUntil = 2026-11-26
reason = """zstd 0.13.3 / zstd-safe 7.3.0, linked through xezim-core, which only opens a fresh single-threaded stream Encoder per file it writes and a read-side stream Decoder per file it reads, with no dictionary. \
Use-after-free with CParameter::StableInBuffer: the parameter is never set (the stream encoder sets only the compression level). \
Drop when xezim-core moves to zstd >= 0.14.3 / zstd-safe >= 8.2.0; review by 2026-11-26."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0396"
